name: Auto-Claim Jules PRs

on:
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

jobs:
  claim-commits:
    # Trigger whenever a PR is created by the Jules bot or on a jules branch in the same repository
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'jules/') ||
       github.actor == 'google-labs-jules[bot]' ||
       github.event.pull_request.user.login == 'google-labs-jules[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Jules PR Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Use PAT if you want your avatar credited for triggering downstream checks,
          # or GITHUB_TOKEN for default runner auth:
          token: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Configure Your Git Identity
        run: |
          git config --global user.name "Adarsh"
          git config --global user.email "udhabhaw@gmail.com"

      - name: Re-author Commit and Push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Check if the commit is already re-authored to avoid infinite synchronize loops
          CURRENT_AUTHOR_EMAIL=$(git log -1 --format='%ae')
          if [ "$CURRENT_AUTHOR_EMAIL" = "udhabhaw@gmail.com" ]; then
            echo "Commit is already authored by udhabhaw@gmail.com. Skipping re-authoring."
            exit 0
          fi

          # Rewrites the commit author and committer to your identity
          git commit --amend --reset-author --no-edit
          git push origin "$HEAD_REF" --force

