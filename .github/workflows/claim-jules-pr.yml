name: Auto-Claim Jules PRs

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  claim-commits:
    # Trigger whenever a PR is created by the Jules bot or on a jules branch
    if: github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'jules/') || github.actor == 'google-labs-jules[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Jules PR Branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # Use PAT if you want your avatar credited for triggering downstream checks,
          # or GITHUB_TOKEN for default runner auth:
          token: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Configure Your Git Identity
        run: |
          git config --global user.name "Adarsh"
          git config --global user.email "udhabhaw@gmail.com"

      - name: Re-author Commit and Push
        run: |
          # Rewrites the commit author and committer to your identity
          git commit --amend --reset-author --no-edit
          git push origin ${{ github.head_ref }} --force
