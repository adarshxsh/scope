name: Auto-Claim Jules PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  claim-commits:
    # Trigger whenever a PR is created by the Jules bot or on a jules branch
    if: startsWith(github.head_ref, 'jules/') || github.actor == 'google-labs-jules[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Jules PR Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
